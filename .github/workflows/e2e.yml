name: Playwright E2E

on:
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: npm run build
      - name: Start app
        run: |
          npx wait-on tcp:3000 &
          npm start &
          npx wait-on http://localhost:3000
      - name: Run E2E tests
        run: npx playwright test

