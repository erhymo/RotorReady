name: Playwright E2E

# Runs on pushes to main as well as pull requests: work lands on main directly
# here, so a pull-request-only trigger meant the suite never gated anything.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm ci
      # Content is served live to installed apps, so a malformed file would
      # reach users without passing through a store review. Check it first.
      - run: npm run validate:content
      - run: npx playwright install --with-deps
      # The workflow builds and starts the server itself so it happens once.
      # playwright.config.ts starts its own only when PLAYWRIGHT_BASE_URL is
      # unset, so that variable is set on the test step below — without it
      # Playwright tried to take port 3000 a second time and aborted before
      # running anything. The admin bypass has to be set on both the build and
      # the start, because middleware.ts reads it at request time and
      # admin-api-fallbacks.spec.ts depends on it.
      - name: Build
        run: npm run build
        env:
          E2E_BYPASS_ADMIN_AUTH: '1'
      - name: Start app
        run: |
          npm start &
          npx wait-on http://localhost:3000
        env:
          E2E_BYPASS_ADMIN_AUTH: '1'
      - name: Run E2E tests
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000

