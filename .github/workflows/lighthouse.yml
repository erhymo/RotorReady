name: Lighthouse CI

# Runs on pushes to main as well as pull requests: work lands on main directly
# here, so a pull-request-only trigger meant the suite never gated anything.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lhci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Node version Vercel builds production with, so this
          # job measures the runtime users actually get.
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Start app
        run: |
          npx wait-on tcp:3000 &
          npm start &
          npx wait-on http://localhost:3000
      - name: Run Lighthouse CI
        run: npx lhci autorun --collect.url=http://localhost:3000 --upload.target=temporary-public-storage

