<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1000" width="840" height="1000" role="img" aria-label="ENG FIRE – AS350 B3e engine fire procedures">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    :root {
      --ink:#111; --rule:#111; --panel-bg:#000; --warn:#c40000;
    }

    .frame { fill:none; stroke:var(--rule); stroke-width:1.8; }
    .col-line { stroke:var(--rule); stroke-width:1.5; }
    .txt { font-family: Arial, Helvetica, sans-serif; fill:var(--ink); }
    .heading { font:700 18px/1.3 Arial, Helvetica, sans-serif; }
    .branchTitle { font:700 16px/1.3 Arial, Helvetica, sans-serif; }
    .body { font:15px/1.4 Arial, Helvetica, sans-serif; }
    .tile { fill:var(--panel-bg); stroke:var(--rule); stroke-width:1; }
    .tileText { font:700 22px/1 Arial, Helvetica, sans-serif; fill:#ff2d2d; text-anchor:middle; }
    .warn { font:700 20px/1.3 Arial, Helvetica, sans-serif; fill:var(--warn); }
  </style>

  <!-- Outer frame and column split -->
  <rect x="20" y="20" width="800" height="960" class="frame"/>
  <line x1="200" y1="20" x2="200" y2="980" class="col-line"/>

  <!-- Left column: panel -->
  <rect x="55" y="70" width="100" height="80" rx="4" class="tile"/>
  <text x="105" y="103" class="tileText">ENG</text>
  <text x="105" y="129" class="tileText">FIRE</text>

  <text x="40" y="180" class="txt body">Fire in engine bay.</text>

  <!-- Right column: procedures -->
  <text x="220" y="60" class="txt heading">SECTION 3.6 – CAUTION AND WARNING PANEL</text>
  <text x="220" y="88" class="txt heading">AS350 B3e – ENG FIRE</text>

  <!-- At Start-up -->
  <text x="220" y="130" class="txt branchTitle">At Start-up:</text>
  <text x="230" y="155" class="txt body">1. Engine starting selector ........................ OFF position.</text>
  <text x="230" y="178" class="txt body">2. Emergency fuel shut-off handle ............... AFT.</text>
  <text x="230" y="201" class="txt body">3. [FUEL PUMP] ....................................... OFF.</text>
  <text x="230" y="224" class="txt body">4. [CRANK] .............................................. PRESS (10 sec.).</text>
  <text x="230" y="247" class="txt body">5. Rotor brake ......................................... APPLY (≤ 170 rpm).</text>
  <text x="230" y="270" class="txt body">6. [BATT] .................................................. OFF.</text>
  <text x="230" y="293" class="txt body">7. Evacuate aircraft and fight fire from outside.</text>

  <!-- Hover / Takeoff / Final -->
  <text x="220" y="335" class="txt branchTitle">Hover, Takeoff, Final:</text>
  <text x="220" y="362" class="txt warn">LAND IMMEDIATELY.</text>
  <text x="220" y="387" class="txt body">Carry out a no hover powered landing.</text>
  <text x="220" y="410" class="txt body">Once on ground, apply same procedure as above.</text>

  <!-- In flight -->
  <text x="220" y="455" class="txt branchTitle">In flight:</text>
  <text x="220" y="482" class="txt warn">LAND IMMEDIATELY.</text>
  <text x="230" y="507" class="txt body">1. Collective ............................................... LOWER.</text>
  <text x="230" y="530" class="txt body">2. IAS .............................................................. Vy.</text>
  <text x="230" y="553" class="txt body">3. Autorotation procedure ........................ APPLY.</text>
  <text x="230" y="576" class="txt body">4. Emergency fuel shut-off handle ............ AFT.</text>
  <text x="230" y="599" class="txt body">5. [FUEL PUMP] .......................................... CHECK OFF.</text>
  <text x="230" y="622" class="txt body">6. Engine starting selector ........................ OFF position.</text>

  <!-- After landing -->
  <text x="220" y="670" class="txt branchTitle">After landing:</text>
  <text x="230" y="695" class="txt body">7. Rotor brake ............................................. APPLY (≤ 170 rpm).</text>
  <text x="230" y="718" class="txt body">8. [BATT] ..................................................... OFF.</text>
  <text x="230" y="741" class="txt body">9. Evacuate aircraft and fight fire from outside.</text>

  <!-- Footer style cue -->
  <text x="40" y="940" class="txt body" font-size="12">RFM H125 AS350 B3e – Section 3.6 – Page 1 (24-05)</text>
</svg>
