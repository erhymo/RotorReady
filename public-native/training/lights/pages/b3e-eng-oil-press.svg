<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" role="img" aria-label="ENG P – AS350 B3e engine oil pressure low">
  <rect width="100%" height="100%" fill="white" />
  <style>
    .frame { fill: none; stroke: #111; stroke-width: 1.5; }
    .text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .heading { font-weight: 700; font-size: 18px; }
    .body { font-size: 15px; }
    .tile { fill: #000; stroke: #111; stroke-width: 1; }
    .tileText { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #ff2d2d; text-anchor: middle; }
  </style>

  <rect x="10" y="10" width="800" height="500" class="frame" />
  <line x1="190" y1="10" x2="190" y2="510" stroke="#111" stroke-width="1.5" />

  <!-- Left column: panel tile and description -->
  <rect x="50" y="60" width="100" height="70" rx="4" class="tile" />
  <text x="100" y="95" class="tileText">ENG P</text>

  <text x="30" y="160" class="text body">Engine oil pressure below limit.</text>

  <!-- Right column: procedure -->
  <text x="210" y="60" class="text heading">ENG P – Engine oil pressure low</text>

  <text x="210" y="100" class="text body">1. Oil pressure .......................... CHECK gauge.</text>

  <text x="210" y="140" class="text heading">If oil pressure is low or nil:</text>
  <text x="220" y="165" class="text body">- LAND IMMEDIATELY.</text>
  <text x="220" y="188" class="text body">- Autorotation procedure .... APPLY.</text>
  <text x="220" y="211" class="text body">- Shut down engine, time permitting.</text>

  <text x="210" y="255" class="text heading">If oil pressure is normal:</text>
  <text x="220" y="280" class="text body">- LAND AS SOON AS PRACTICABLE.</text>

  <text x="30" y="490" class="text body" font-size="12">RFM H125 AS350 B3e – Section 3 – Engine oil pressure low (ENG P)</text>
</svg>
