<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" role="img" aria-label="FUEL – AS350 B3e low fuel quantity">
  <rect width="100%" height="100%" fill="white" />
  <style>
    .frame { fill: none; stroke: #111; stroke-width: 1.5; }
    .text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .heading { font-weight: 700; font-size: 18px; }
    .body { font-size: 15px; }
    .warning { font-weight: 700; font-size: 16px; fill: #c40000; }
    .tile { fill: #000; stroke: #111; stroke-width: 1; }
    .tileText { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #ff2d2d; text-anchor: middle; }
  </style>

  <rect x="10" y="10" width="800" height="460" class="frame" />
  <line x1="190" y1="10" x2="190" y2="470" stroke="#111" stroke-width="1.5" />

  <!-- Left column -->
  <rect x="40" y="60" width="120" height="70" rx="4" class="tile" />
  <text x="100" y="95" class="tileText">FUEL</text>

  <text x="30" y="170" class="text body">Fuel quantity low.</text>

  <!-- Right column -->
  <text x="210" y="60" class="text heading">FUEL – Low fuel quantity</text>

  <text x="210" y="100" class="text body">1. LAND AS SOON AS POSSIBLE.</text>
  <text x="210" y="125" class="text body">2. NOTE: Approximately fifteen minutes of</text>
  <text x="228" y="148" class="text body">flight time remain at maximum continuous</text>
  <text x="228" y="171" class="text body">power.</text>

  <text x="210" y="210" class="warning">WARNING</text>
  <text x="210" y="235" class="text body">Avoid large attitude changes as this could</text>
  <text x="228" y="258" class="text body">lead to an engine flame out.</text>

  <text x="30" y="445" class="text body" font-size="12">RFM H125 AS350 B3e – Section 3.6 – FUEL</text>
</svg>
