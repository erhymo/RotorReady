<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" role="img" aria-label="INV – AS350 B3e AC inverter failure">
  <rect width="100%" height="100%" fill="white" />
  <style>
    .frame { fill: none; stroke: #111; stroke-width: 1.5; }
    .text { font-family: Arial, Helvetica, sans-serif; fill: #111; }
    .heading { font-weight: 700; font-size: 18px; }
    .body { font-size: 15px; }
    .tile { fill: #000; stroke: #111; stroke-width: 1; }
    .tileText { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #ffcc00; text-anchor: middle; }
  </style>

  <rect x="10" y="10" width="800" height="400" class="frame" />
  <line x1="190" y1="10" x2="190" y2="410" stroke="#111" stroke-width="1.5" />

  <!-- Left column -->
  <rect x="50" y="60" width="100" height="70" rx="4" class="tile" />
  <text x="100" y="100" class="tileText">INV</text>

  <text x="30" y="170" class="text body">AC power supply failure.</text>

  <!-- Right column -->
  <text x="210" y="60" class="text heading">INV – AC power supply failure</text>

  <text x="210" y="100" class="text body">1. [INV] ........................................ CHECK ON.</text>

  <text x="210" y="140" class="text heading">If loss of all AC consumers:</text>
  <text x="220" y="165" class="text body">- [INV] ........................................ ON.</text>
  <text x="220" y="190" class="text body">- AFCS disengages automatically</text>
  <text x="238" y="213" class="text body">(if installed).</text>
  <text x="220" y="238" class="text body">- Controls ............................ HANDS ON.</text>
  <text x="220" y="263" class="text body">- CONTINUE FLIGHT.</text>

  <text x="30" y="380" class="text body" font-size="12">RFM H125 AS350 B3e – Section 3.6 – INV</text>
</svg>
