<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 800" width="840" height="800" role="img" aria-label="GENE – AS350 B3e DC generator off line">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="black"/>
    </marker>
  </defs>

  <!-- Outer frame -->
  <rect x="1" y="1" width="838" height="778" fill="white" stroke="black" stroke-width="2"/>

  <!-- Left column -->
  <rect x="30" y="50" width="100" height="70" fill="black"/>
  <text x="80" y="80" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="yellow" text-anchor="middle">GENE</text>

  <text x="30" y="165" font-family="Arial, sans-serif" font-size="18">DC generator</text>
  <text x="30" y="190" font-family="Arial, sans-serif" font-size="18">off line</text>

  <!-- Separator line -->
  <line x1="160" y1="20" x2="160" y2="760" stroke="black" stroke-width="1.5"/>

  <!-- Procedure steps -->
  <text x="180" y="70" font-family="Arial, sans-serif" font-size="18" font-weight="bold">1. U bus on VEMD ................ CHECK.</text>
  <text x="180" y="95" font-family="Arial, sans-serif" font-size="18" font-weight="bold">2. [GENE] ............................... CHECK ON.</text>

  <!-- Branch from CHECK ON -->
  <line x1="470" y1="112" x2="240" y2="112" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="470" y1="112" x2="720" y2="112" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- YES branch -->
  <line x1="270" y1="112" x2="270" y2="150" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="250" y="170" font-family="Arial, sans-serif" font-size="16">[GENE] ON</text>

  <text x="180" y="205" font-family="Arial, sans-serif" font-size="18">"GENE RST" circuit breaker ........ CHECK not popped out.</text>
  <text x="180" y="230" font-family="Arial, sans-serif" font-size="18">[GENE RST] ................................. PRESS.</text>
  <text x="180" y="255" font-family="Arial, sans-serif" font-size="18">Unnecessary equipment ............ OFF.</text>
  <text x="180" y="280" font-family="Arial, sans-serif" font-size="18">U bus on VEMD ........................ MONITOR.</text>

  <line x1="300" y1="285" x2="300" y2="330" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="180" y="360" font-family="Arial, sans-serif" font-size="22" font-weight="bold">LAND AS SOON AS PRACTICABLE.</text>

  <!-- NO branch -->
  <line x1="720" y1="112" x2="720" y2="155" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="700" y="175" font-family="Arial, sans-serif" font-size="16">[GENE] NOT ON</text>

  <text x="560" y="205" font-family="Arial, sans-serif" font-size="18">Unnecessary equipment ........ OFF.</text>
  <text x="560" y="230" font-family="Arial, sans-serif" font-size="18">U bus on VEMD ........................ MONITOR.</text>

  <line x1="660" y1="235" x2="660" y2="285" stroke="black" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="560" y="315" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="green">LAND AS SOON AS PRACTICABLE</text>
  <text x="560" y="340" font-family="Arial, sans-serif" font-size="16" fill="green">or CONTINUE FLIGHT as per operational</text>
  <text x="560" y="360" font-family="Arial, sans-serif" font-size="16" fill="green">judgment.</text>

  <!-- Warning about battery / VEMD -->
  <text x="180" y="410" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="orange">WARNING</text>
  <text x="180" y="435" font-family="Arial, sans-serif" font-size="18" fill="orange">IF THE BATTERY FAILS, THE VEMD WILL GO OUT AND</text>
  <text x="180" y="460" font-family="Arial, sans-serif" font-size="18" fill="orange">NR/N2 INDICATION IS LOST. APPLY THE PROCEDURE</text>
  <text x="180" y="485" font-family="Arial, sans-serif" font-size="18" fill="orange">FOR FAILURE OF BOTH SCREENS (SECTION 3.5 §1</text>
  <text x="180" y="510" font-family="Arial, sans-serif" font-size="18" fill="orange">VEMD SCREEN FAILURE). AVOID AUTOROTATION,</text>
  <text x="180" y="535" font-family="Arial, sans-serif" font-size="18" fill="orange">PERFORM A SHALLOW APPROACH WITH A CAUTIOUS</text>
  <text x="180" y="560" font-family="Arial, sans-serif" font-size="18" fill="orange">LANDING.</text>

  <!-- Note -->
  <text x="180" y="600" font-family="Arial, sans-serif" font-size="18" font-weight="bold">NOTE</text>
  <rect x="240" y="583" width="60" height="24" fill="black"/>
  <text x="270" y="600" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="yellow" text-anchor="middle">GENE</text>
  <text x="305" y="600" font-family="Arial, sans-serif" font-size="18">comes on if the DC system is supplied</text>
  <text x="180" y="625" font-family="Arial, sans-serif" font-size="18">with external power.</text>

  <text x="30" y="760" font-family="Arial, sans-serif" font-size="14">RFM H125 AS350 B3e – Section 3.6 – GENE (24-05)</text>
</svg>
