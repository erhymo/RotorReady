<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" role="img" aria-label="BATT TEMP – Battery temperature above maximum">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    :root {
      --ink:#111; --rule:#111; --panel-bg:#000; --red:#e60000; --branch:#111;
    }

    .frame { fill:none; stroke:var(--rule); stroke-width:1.5; }
    .txt { font-family: Arial, Helvetica, sans-serif; fill:var(--ink); }
    .label { font-size:14px; }
    .title { font:700 16px/1.25 Arial, Helvetica, sans-serif; }
    .tile { fill:var(--panel-bg); stroke:var(--rule); stroke-width:1; }
    .tileText { font:700 16px/1 Arial, Helvetica, sans-serif; fill:var(--red); text-anchor:middle; }
    .branch { font:700 18px/1.25 Arial, Helvetica, sans-serif; fill:var(--branch); text-anchor:middle; }
    .arrow { stroke:var(--ink); stroke-width:1.3; marker-end:url(#ah); fill:none; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="12" y="12" width="796" height="336" class="frame"/>
  <line x1="206" y1="12" x2="206" y2="348" stroke="var(--rule)" stroke-width="1.5"/>

  <rect x="52" y="36" width="108" height="70" rx="3" class="tile"/>
  <text x="106" y="66" class="tileText">BATT</text>
  <text x="106" y="90" class="tileText">TEMP</text>

  <text x="40" y="142" class="txt label">Battery temperature</text>
  <text x="40" y="160" class="txt label">above maximum</text>

  <text x="220" y="54" class="txt title">1. [<tspan font-weight="700">EXT PWR BATT</tspan>] or [<tspan font-weight="700">BAT/EPU</tspan>] ........ OFF</text>
  <text x="220" y="82" class="txt title">2. U bus voltage ............................................... CHECK</text>

  <text x="316" y="128" class="txt label" text-anchor="middle">NORMAL</text>
  <text x="540" y="128" class="txt label" text-anchor="middle">ABOVE U max</text>

  <path d="M316,92 V112" class="arrow"/>
  <path d="M540,92 V112" class="arrow"/>

  <path d="M316,140 V212" class="arrow"/>
  <text x="316" y="254" class="branch">LAND AS SOON AS PRACTICABLE</text>

  <text x="430" y="166" class="txt label">If U bus voltage above max:</text>
  <text x="430" y="188" class="txt label">1. [<tspan font-weight="700">EXT PWR BATT</tspan>] or [<tspan font-weight="700">BAT/EPU</tspan>] ... ON</text>
  <text x="430" y="208" class="txt label">2. [<tspan font-weight="700">GEN</tspan>] or [<tspan font-weight="700">GENE</tspan>] ........................ OFF</text>
  <text x="430" y="228" class="txt label">3. Unnecessary equipment .................. OFF</text>

  <path d="M540,232 V260" class="arrow"/>
  <text x="540" y="302" class="branch">LAND AS SOON AS PRACTICABLE</text>
</svg>
