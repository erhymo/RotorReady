<svg xmlns="http://www.w3.org/2000/svg" width="820" height="280" viewBox="0 0 820 280" role="img" aria-label="ENG P – Engine oil pressure warning flow (shorter arrows)">
  <style>
    :root{
      --ink:#111; --rule:#111; --panel-bg:#000; --warn:#e00000;
    }
    @media (prefers-color-scheme: dark){
      :root{ --ink:#eef3fb; --rule:#eef3fb; --panel-bg:#000; --warn:#ff6b6b; }
    }
    .box{ fill:none; stroke:var(--rule); stroke-width:1.5; }
    .txt{ font-family: Arial, Helvetica, sans-serif; fill:var(--ink); }
    .label{ font-size:14px; }
    .title{ font-size:16px; font-weight:700; }
    .warnRect{ fill:var(--panel-bg); stroke:var(--rule); stroke-width:1; }
    .warnText{ font:700 18px/1 Arial, Helvetica, sans-serif; fill:var(--warn); text-anchor:middle; }
    .redCall{ font:700 20px/1.2 Arial, Helvetica, sans-serif; fill:var(--warn); }
    .branch{ font:700 14px/1.2 Arial, Helvetica, sans-serif; fill:var(--ink); }
    .note{ font:13px/1.3 Arial, Helvetica, sans-serif; fill:var(--ink); }
    .arrow{ fill:none; stroke:var(--rule); stroke-width:1.6; }
  </style>

  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="currentColor"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="818" height="278" class="box"/>
  <rect x="1" y="1" width="200" height="278" class="box"/>
  <rect x="36" y="48" width="128" height="64" rx="3" class="warnRect"/>
  <text x="100" y="73" class="warnText">ENG</text>
  <text x="100" y="97" class="warnText">P</text>
  <text x="100" y="138" class="txt label" text-anchor="middle">Engine oil pressure</text>
  <text x="100" y="158" class="txt label" text-anchor="middle">&lt; 1.1 bar (16 psi)</text>

  <rect x="201" y="1" width="618" height="278" class="box"/>
  <text x="220" y="30" class="txt title">Oil pressure............................CHECK gauge.</text>

  <text x="300" y="92" class="branch">LOW or NIL</text>
  <text x="610" y="92" class="branch">NORMAL</text>

  <path d="M500 34 C 460 44, 410 60, 330 78" class="arrow" marker-end="url(#ah)"/>
  <path d="M540 34 C 585 46, 615 60, 640 78" class="arrow" marker-end="url(#ah)"/>

  <line x1="300" y1="98" x2="300" y2="112" class="arrow" marker-end="url(#ah)"/>
  <line x1="610" y1="98" x2="610" y2="112" class="arrow" marker-end="url(#ah)"/>

  <text x="320" y="138" class="redCall">LAND IMMEDIATELY</text>
  <line x1="320" y1="144" x2="320" y2="158" class="arrow" marker-end="url(#ah)"/>
  <text x="230" y="180" class="note">. Autorotation procedure ... APPLY</text>
  <text x="230" y="200" class="note">. Shutdown engine time permitting</text>

  <text x="610" y="136" class="txt title" text-anchor="middle">LAND AS SOON AS</text>
  <text x="610" y="158" class="txt title" text-anchor="middle">PRACTICABLE</text>
</svg>
