<svg xmlns="http://www.w3.org/2000/svg" width="820" height="260" viewBox="0 0 820 260" role="img" aria-label="MGB CHIP – Metal particles in MGB oil circuit (correct)">
  <style>
    :root{
      --ink:#111; --rule:#111; --panel-bg:#000;
      --amber:#ffcc00;
      --caution:#ff8c00;
    }
    @media (prefers-color-scheme: dark){
      :root{ --ink:#e9eef7; --rule:#e9eef7; --panel-bg:#000; --amber:#ffe680; --caution:#ffb84d; }
    }
    .frame{ fill:none; stroke:var(--rule); stroke-width:1.5; }
    .sep{ stroke:var(--rule); stroke-width:1.5; }
    .txt{ font-family: Arial, Helvetica, sans-serif; fill:var(--ink); }
    .label{ font-size:14px; }
    .title{ font:700 16px/1.25 Arial, Helvetica, sans-serif; }
    .tile{ fill:var(--panel-bg); stroke:var(--rule); stroke-width:1; }
    .tileTextAmber{ font:700 18px/1 Arial, Helvetica, sans-serif; fill:var(--amber); text-anchor:middle; }
    .miniTileText{ font:700 13px/1.1 Arial, Helvetica, sans-serif; fill:#ffffff; text-anchor:middle; }
    .caution{ font:700 20px/1.25 Arial, Helvetica, sans-serif; fill:var(--caution); }
  </style>

  <rect x="12" y="12" width="796" height="236" class="frame"/>
  <line x1="206" y1="12" x2="206" y2="248" class="sep"/>

  <rect x="60" y="38" width="90" height="62" rx="3" class="tile"/>
  <text x="105" y="63" class="tileTextAmber">MGB</text>
  <text x="105" y="85" class="tileTextAmber">CHIP</text>

  <text x="42" y="120" class="txt label">Metal particles in</text>
  <text x="42" y="140" class="txt label">MGB oil circuit</text>

  <text x="218" y="48" class="txt title">
    Collective..................................... <tspan font-weight="700">REDUCE power</tspan>
  </text>

  <rect x="260" y="78" width="70" height="36" rx="3" class="tile"/>
  <text x="295" y="92" class="miniTileText">MGB</text>
  <text x="295" y="106" class="miniTileText">P</text>

  <text x="338" y="101" class="txt label">and</text>

  <rect x="372" y="78" width="90" height="36" rx="3" class="tile"/>
  <text x="417" y="92" class="miniTileText">MGB</text>
  <text x="417" y="106" class="miniTileText">TEMP</text>

  <text x="470" y="101" class="txt title" font-weight="700">...... MONITOR</text>

  <text x="410" y="150" class="caution" text-anchor="middle">LAND AS SOON AS POSSIBLE</text>
</svg>
