<svg xmlns="http://www.w3.org/2000/svg" width="820" height="180" viewBox="0 0 820 180" role="img" aria-label="TGB CHIP – Metal particles in TGB oil circuit (Continue flight)">
  <style>
    :root{
      --ink:#111; --rule:#111; --panel-bg:#000;
      --amber:#ffcc00; --ok:#118a11;
    }
    @media (prefers-color-scheme: dark){
      :root{ --ink:#e9eef7; --rule:#e9eef7; --panel-bg:#000; --amber:#ffe680; --ok:#7ee07e; }
    }
    .frame{ fill:none; stroke:var(--rule); stroke-width:1.5; }
    .sep{ stroke:var(--rule); stroke-width:1.5; }
    .txt{ font-family: Arial, Helvetica, sans-serif; fill:var(--ink); }
    .label{ font-size:14px; }
    .title{ font:700 16px/1.2 Arial, Helvetica, sans-serif; }
    .tile{ fill:var(--panel-bg); stroke:var(--rule); stroke-width:1; }
    .tileText{ font:700 18px/1 Arial, Helvetica, sans-serif; fill:var(--amber); text-anchor:middle; }
    .ok{ font:700 22px/1.2 Arial, Helvetica, sans-serif; fill:var(--ok); }
  </style>

  <rect x="12" y="12" width="796" height="156" class="frame"/>
  <line x1="206" y1="12" x2="206" y2="168" class="sep"/>

  <rect x="60" y="32" width="90" height="62" rx="3" class="tile"/>
  <text x="105" y="57" class="tileText">TGB</text>
  <text x="105" y="79" class="tileText">CHIP</text>

  <text x="36" y="115" class="txt label">Metal particles in</text>
  <text x="36" y="135" class="txt label">TGB oil circuit</text>

  <text x="410" y="56" class="title" text-anchor="middle">Avoid prolonged hovering</text>
  <text x="410" y="96" class="ok" text-anchor="middle">CONTINUE FLIGHT</text>
</svg>
