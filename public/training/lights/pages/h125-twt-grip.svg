<svg xmlns="http://www.w3.org/2000/svg" width="820" height="230" viewBox="0 0 820 230" role="img" aria-label="TWT GRIP – Twist grip out of FLIGHT position">
  <rect width="100%" height="100%" fill="white"/>
  <style>
    :root{
      --ink:#111; --rule:#111; --panel-bg:#000; --warn:#e00000; --ok:#0a8a0a;
    }

    .box{ fill:none; stroke:var(--rule); stroke-width:1.5; }
    .txt{ font-family: Arial, Helvetica, sans-serif; fill:var(--ink); }
    .label{ font-size:14px; }
    .title{ font:700 16px/1.2 Arial, Helvetica, sans-serif; fill:var(--ink); }
    .warnRect{ fill:var(--panel-bg); stroke:var(--rule); stroke-width:1; }
    .warnText{ font:700 18px/1 Arial, Helvetica, sans-serif; fill:var(--warn); text-anchor:middle; }
    .ok{ font:700 22px/1.2 Arial, Helvetica, sans-serif; fill:var(--ok); }
  </style>

  <rect x="12" y="12" width="796" height="206" class="box"/>
  <line x1="206" y1="12" x2="206" y2="218" stroke="var(--rule)" stroke-width="1.5"/>

  <rect x="60" y="38" width="90" height="62" rx="3" class="warnRect"/>
  <text x="105" y="63" class="warnText">TWT</text>
  <text x="105" y="85" class="warnText">GRIP</text>

  <text x="42" y="118" class="txt label" text-anchor="start">Twist grip out of</text>
  <text x="42" y="138" class="txt label" text-anchor="start">FLIGHT position</text>

  <text x="218" y="48" class="title">
    Twist grip............................ <tspan font-weight="700">TURN to FLIGHT position</tspan>
  </text>

  <text x="410" y="120" class="ok" text-anchor="middle">CONTINUE FLIGHT</text>
</svg>
